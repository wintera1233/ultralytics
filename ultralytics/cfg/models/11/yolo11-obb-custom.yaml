# Parameters
nc: 2  # Set this to your specific number of classes (hazelnuts/markers)
scales: 
  n: [0.50, 0.25, 1024] 

# YOLO11n backbone
backbone:
  - [-1, 1, Conv, [64, 3, 2]]   # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]  # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]]  # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]]  # 5-P4/16
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]]    # 9
  - [-1, 2, C2PSA, [1024]]      # 10

# YOLO11n head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 11 (P4/16)
  - [[-1, 6], 1, Concat, [1]]                   # 12
  - [-1, 2, C3k2, [512, False]]                 # 13

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 14 (P3/8)
  - [[-1, 4], 1, Concat, [1]]                   # 15
  - [-1, 2, C3k2, [256, False]]                 # 16

# --- NEW P2 SECTION ---
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 17 (P2/4)
  - [[-1, 2], 1, Concat, [1]]                   # 18
  - [-1, 2, C3k2, [128, False]]                 # 19 
  - [-1, 1, EMA, [128]]                         # 20 

  - [-1, 1, Conv, [128, 3, 2]]                  # 21 
  - [[-1, 16], 1, Concat, [1]]                  # 22 
  - [-1, 2, C3k2, [256, False]]                 # 23

  - [-1, 1, Conv, [256, 3, 2]]                  # 24
  - [[-1, 13], 1, Concat, [1]]                  # 25 
  - [-1, 2, C3k2, [512, False]]                 # 26 

  - [-1, 1, Conv, [512, 3, 2]]                  # 27 
  - [[-1, 10], 1, Concat, [1]]                  # 28 
  - [-1, 2, C3k2, [1024, True]]                 # 29 (Detect Source 4)

  # Final Head
  - [[20, 23, 26, 29], 1, OBB, [nc, 1]]         # 30       